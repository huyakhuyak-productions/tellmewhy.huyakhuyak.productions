<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tellmewhy">
  <style>
    .bubble { fill: #5457c4; }
    .glyph-fill { fill: #f7f5fa; }
    .glyph-stroke { fill: none; stroke: #f7f5fa; }
    @media (prefers-color-scheme: dark) {
      .bubble { fill: #9294ef; }
      .glyph-fill { fill: #131218; }
      .glyph-stroke { stroke: #131218; }
    }
  </style>
  <!-- Speech bubble: a rounded body with a soft tail at the lower left -->
  <path class="bubble" d="M9 4h14a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5h-8.2l-5.1 4.4A1 1 0 0 1 8 26.6V23a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5Z"/>
  <!-- Question mark, quiet and rounded -->
  <path class="glyph-stroke" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
    d="M13.1 14.4A3.8 3.8 0 1 1 18.6 13.9C17.2 15.1 16 15.8 16 17.6L16 18.6"/>
  <circle class="glyph-fill" cx="16" cy="21.3" r="1.55"/>
</svg>
